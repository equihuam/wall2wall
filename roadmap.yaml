schema: frutlups.roadmap/2
project: wall2wall
brief: 00_brief/
runtime:
  python: '3.11'
verification:
  full:
  - python
  - scripts/hermetic_verification.py
  focused_default: []
  timeout_seconds: 1200
  observation: process
allowed_prefixes:
- 08_pkg/
- 01_data/
- 03_experiments/
- 04_delivery/
- 06_infra/
forbidden:
- 00_brief/
- 05_governance/
- prompts/
- questions/answered/
- roadmap.yaml
- frutlups.toml
- AGENTS.md
- CLAUDE.md
- scripts/
- tests/
- pyproject.toml
review:
  ordinary:
  - reviewer
  high:
  - reviewer
  release:
  - reviewer
milestones:
- id: M001
  title: Linux/WSL2, Micromamba y cualificación Python 3.11
  status: active
  risk: ordinary
  holistic_review: true
  slices:
  - id: M001-S01
    title: Prueba exacta Linux, Micromamba y Snakemake
    objective: Cualificar plataforma Linux/WSL2, entorno fijo 3.11, plantilla y DAG mínimo.
    acceptance:
    - 'V1/V7/D012: Linux x86-64 en WSL2 o nativo; Python 3.11 del prefijo Micromamba fijo. Registrar
      distribución, arquitectura, canales, builds/hashes, GDAL, Pytest y Snakemake.'
    - Arquitecto cualifica Git/ledger/lock/verificador en Linux antes de baseline. Probar GeoTIFF,
      CRS, RF y DAG de dos procesos con artefactos persistidos y segunda ejecución sin trabajo.
    - Crear 08_pkg/tests/run_checks.py con Pytest; full descubre suites y falla ante cero pruebas,
      skips requeridos o dependencia ausente; sólo usar procesos Linux del entorno fijo.
    - Sin entornos por regla ni uso de Python/Conda Windows. WSL/Micromamba ausentes bloquean ejecución,
      no esta planificación; no instalar sistema ni migrar archivos automáticamente. Respetar R1–R6.
    non_goals:
    - API final, workflow completo o experimentos científicos.
    - Modificar sistema, entorno base o herramientas de plantilla desde el asiento coder.
    read_first:
    - 00_brief/CONTEXT.md
    - 00_brief/architecture.md
    - 00_brief/validation.md
    - 08_pkg/CONTEXT.md
    - 00_brief/decisions.md
    - 00_brief/orchestration.md
    allowed_prefixes:
    - 06_infra/
    - 08_pkg/tests/
    - 08_pkg/workflow/
    focused: []
    kind: code
    notes: Plan inicial sin emisión. Antes de emitir, el arquitecto añade lecturas exactas del código/pruebas
      existentes y comando enfocado; las rutas de salida aún no existentes no son lecturas requeridas.
