  - id: M004-S01
    title: Random Forest y evaluación fija
    objective: Implementar evaluación espacial OOF y ajuste final separados.
    acceptance:
    - Windows D014/Python 3.11 mediante 06_infra/windows.ps1 -PythonArgs. Crear modeling.py y
      test_modeling.py usando dependencias core instaladas. APIs en wall2wall.modeling; conservar
      import wall2wall ligero. Sin extras, dependencias nuevas ni cambios de entorno.
    - 'API evaluate(table, schema, output_dir, *, fold_config, estimator=None): table/schema son
      salidas de sample_points. fold_config contiene exactamente parámetros públicos de
      make_spatial_folds salvo table/schema/output_dir: block_size, origin, n_splits, seed y
      opcionales buffer_distance, min_train_samples, provided_splits. Reutilizar esa función una
      sola vez para construir/validar folds y persistirlos en output_dir/folds; no aceptar un dict
      de splits presuntamente validado ni duplicar el algoritmo espacial. Evaluar modelo y
      DummyRegressor(strategy="mean") sobre idénticos splits finales, incluidos buffers.'
    - 'estimator=None crea RandomForestRegressor(n_estimators=100, max_depth=None,
      min_samples_leaf=2, max_features=1.0, bootstrap=True, random_state=17, n_jobs=1).
      Permitir regresor sklearn clonable o Pipeline clonable con fit/predict y parámetros
      describibles en JSON estricto (componentes por clase y parámetros, sin repr ni pickle);
      rechazar clasificadores, estimadores no clonables y
      configuraciones no reproducibles: random_state expuesto debe ser entero no negativo,
      n_jobs expuesto debe ser 1. Inspeccionar parámetros anidados; rechazar warm_start=True
      y early_stopping activo. No aceptar fit kwargs, callbacks ni eval_set. No mutar el
      estimador ni entrenarlo globalmente antes de evaluar; no prometer soporte universal.'
    - 'Validar tabla/esquema antes de ajustar: columnas únicas, IDs únicos no nulos y respuesta
      continua finita; schema.predictors no vacío, nombres únicos existentes y sin colisión
      con respuesta, IDs, coordenadas o auxiliares de muestreo. X contiene sólo esas columnas
      en orden del esquema, numéricas finitas; sin conversión categórica ni selección implícita.
      Validar metadatos de nombres/unidades/períodos y respuesta. Preservar table/schema y tipos
      de IDs. Validación espacial adicional corresponde a make_spatial_folds en evaluate.'
    - Clonar modelo y dummy por fold, ajustar cada clon sólo con train y predecir sólo test.
      Todo preprocesamiento de Pipeline se ajusta dentro del fold. Mantener índices posicionales
      en table, independientes de índice pandas/input_row; cada observación tiene una predicción
      OOF por modelo, sin escribir sobre otra ni dejar posiciones vacías. Validar predicciones
      numéricas finitas y shape (n_test,). Fallos de fit/predict se propagan con contexto del fold,
      sin reemplazar por dummy, repetir candidatos ni ocultar resultados pobres.
    - 'Retornar dict con oof como DataFrame, metrics como dict y folds como resultado de la API
      espacial. oof conserva orden de entrada, sample_id, position, fold_id, observed, predicted
      y dummy_predicted; no incorporar IDs/objetivo entre predictores. Escribir oof_predictions.csv,
      metrics.json y manifest.json, además de folds/. El manifiesto identifica columnas ordenadas,
      respuesta, clase/parámetros efectivos, versiones Python/core, configuración espacial,
      conteos de ajustes realizados y productos mediante rutas relativas. JSON estricto, sin
      rutas de máquina. No persistir modelos de folds ni implementar expediente general M005.'
    - 'Métricas para modelo y dummy: RMSE, MAE, sesgo=media(predicho-observado), R²=1-SSE/SST,
      por fold y sobre OOF agrupado. Incluir n, media y desviación poblacional no ponderadas
      de las métricas por fold, distinguiéndolas de OOF agrupado. R² con n<2 o respuesta constante
      es null con motivo, nunca 0/1 forzado; resúmenes de R² usan folds definidos y registran
      su número, null si ninguno. Métricas no finitas por desbordamiento deben rechazarse con
      error explícito, no serializar NaN/Infinity. Pruebas independientes calculadas a mano.'
    - 'API separada fit_final(table, schema, *, estimator=None): validar mismo esquema tabular,
      clonar y ajustar una sola vez con todos los casos completos; retornar dict con estimator
      ajustado, predictors ordenados y metadatos de respuesta. No ejecutar CV ni llamar evaluate,
      no generar OOF/métricas de evaluación ni escribir archivos. evaluate no invoca fit_final.
      El modelo final no incluye el dummy por defecto; persistencia/carga pertenece a M005.'
    - Destino evaluate nuevo, incluso si el existente está vacío; rechazar sin alterar datos.
      Validar contrato tabular/estimador/configuración antes de crear destino cuando sea posible;
      fallo de folds/fit/escritura puede conservar parciales, nunca manifiesto de éxito. Publicar
      manifiesto al final tras cerrar archivos. Pruebas de inmutabilidad, destino existente y
      fallos de fit/predict/escritura. Mantener contratos de grupos y buffer en los folds usados.
    - 'Pytest: estimador y transformador espías verifican filas vistas por fit/transform/predict,
      clones nuevos por fold, exclusiones del buffer fuera de fit, original sin mutar y dummy
      igual a media del train correspondiente. Probar índice pandas no único/orden mezclado,
      esquema predictor reordenado, valores/IDs/esquemas inválidos, predicción con shape erróneo
      o no finita, configuración no admitida y Pipeline sin fuga. fit_final usa todos los casos
      exactamente una vez y no produce evidencia OOF. Probar CSV con tipos explícitos para IDs
      como 001/NA y métricas de n=1, respuesta constante, folds de tamaño desigual y sesgo con signo.'
    - 'Protocolo técnico congelado antes de resultados: fixture signal semilla 17 de generate,
      align/sample existentes, seis predictores p01..p06; folds generados de cuatro partes,
      bloque 320 m, origen (500000,4498720), seed=17, buffer=0 y RF predeterminado indicado.
      Exigir RMSE OOF RF <=0.9*RMSE OOF dummy. Repetir mismo caso comprueba igualdad dentro
      de rtol/atol=1e-10. Añadir no_signal semilla 17 con idéntica configuración, sin umbral
      de superioridad. No cambiar semillas, ruido, parámetros o particiones tras observar el
      cociente; si falla, conservar resultado y reportar al arquitecto sin búsqueda correctiva.'
    - Estos casos son pruebas técnicas deterministas de V4, no un lote científico R4 ni prueba
      de utilidad ecológica. Máximo 64 ajustes por invocación de suite modeling, incluidos
      repeticiones, dummy, espías y finales; el coder cuenta ajustes antes de ejecutar y registra
      el total. Para pruebas analíticas usar estimadores mínimos; RF científico sólo configuración
      congelada. Cero búsquedas, nuevos canaries o evaluaciones reales; fallo común de infraestructura
      detiene casos restantes. El wheel dispone de hasta dos ajustes mínimos adicionales.
    - Extender test_installed_wheel para incluir modeling.py y verificar fit_final y predicción
      mínima desde wheel en proceso/cwd externo sin cambiar garantías previas. Añadir
      --modeling-only mutuamente excluyente a tests/run_checks.py y nuevos IDs obligatorios;
      full conserva 105 pruebas previas más nuevas y 16 de infraestructura/encabezados. Cero,
      skips o IDs ausentes fallan; Pytest no invoca full. Sin modificar suites previas salvo
      test_package.py ni infraestructura ejecutable.
    - 'D016: encabezados canónicos en Python nuevos/modificados, añadir modeling.py y
      test_modeling.py al scope conservando quince rutas. README documenta evaluate/fit_final,
      esquemas, OOF, métricas, referencia dummy, limitaciones, protocolo y comandos Windows.
      No anunciar mapas, tuning, persistencia de modelos o soporte Linux aún no cualificado.'
    - 'R2/R3: ronda <=60 min, <=20000 tokens medidos o unknown, hasta dos correcciones técnicas;
      full <=1200 s, scratch <=512 MiB, n_jobs=1 y un ajuste concurrente. Tablas en memoria,
      RAM nativa y scratch máximo medidos o unknown. Temporales fuera del checkout, sin red,
      instalaciones, commit ni push del coder. Arquitecto coteja baseline/manifiesto con gate.'
    non_goals:
    - Selección de parámetros/familias, CV anidada, importancia por permutación, LightGBM/XGBoost,
      early stopping, inferencia causal, mapas, joblib/persistencia, workflow o piloto real.
    - Cambiar módulos/suites espaciales, simulador, __init__.py, pyproject, locks, infraestructura,
      evidencia histórica o contexto arquitectónico desde el coder.
    read_first:
