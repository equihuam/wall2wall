      al final. Errores de contrato o entrenamiento insuficiente no dejan destino; fallo de escritura
      no deja manifiesto final. Distancia usa buffers <=128 MiB; RAM nativa medida o unknown.
    - 'Pytest nuevo en test_buffer.py: buffer cero equivalente al contrato previo; puntos dentro,
