      focused/full y límites de memoria/compatibilidad. El arquitecto coteja baseline y manifiesto
      de cambios con el alcance del gate antes de verificar.'
    - 'R2/R3: ronda <=60 min, <=20000 tokens si medibles o unknown, hasta dos correcciones; full
      <=1200 s, scratch <=512 MiB. Temporales/pruebas fuera del checkout, sin datos reales, red,
