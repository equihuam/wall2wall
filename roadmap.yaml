schema: frutlups.roadmap/2
project: wall2wall
brief: 00_brief/
runtime:
  python: '3.11'
verification:
  full:
  - python
  - 06_infra/linux_smoke/verify_preparation.py
  focused_default: []
  timeout_seconds: 120
  observation: process
allowed_prefixes:
- ENVIRONMENT.md
- 08_pkg/
- 01_data/
- 03_experiments/
- 04_delivery/
- 06_infra/
forbidden:
- 00_brief/
- 05_governance/
- prompts/
- questions/answered/
- roadmap.yaml
- frutlups.toml
- AGENTS.md
- CLAUDE.md
- scripts/
- tests/
- pyproject.toml
review:
  ordinary:
  - reviewer
  high:
  - reviewer
  release:
  - reviewer
milestones:
- id: M001
  title: Linux/WSL2, Micromamba y cualificación Python 3.11
  status: active
  risk: ordinary
  holistic_review: true
  slices:
  - id: M001-S01
    title: Cualificación documental Linux y preservación de evidencia D020
    objective: Cerrar la documentación de la infraestructura Linux ya preparada, comprobando identidades
      y runtime sin repetir el canary D020; someter la baseline completa a revisión.
    acceptance:
    - 'D021: trabajar y escribir sólo en el checkout Linux propietario seleccionado por la configuración
      local de WSL. Usar bash 06_infra/linux.sh para Python; desde Windows, wsl.ps1 sólo despacha al mismo
      checkout. No escribir ni sincronizar la copia Windows, cambiar HEAD/índice, instalar, hacer commit
      o push.'
    - 'Entrega documental sobre la preparación D020 ya ejecutada: modificar sólo 06_infra/LINUX.md, ENVIRONMENT.md
      y 08_pkg/CONTEXT.md. Corregir afirmaciones obsoletas sobre inexistencia del paquete/workflow y reflejar
      el propietario Linux de esta ronda; conservar la historia Windows y la autoridad del ledger. No afirmar
      que M001 está aceptado antes del dictamen y registro, ni que M006/M008 están cerrados.'
    - Documentar Ubuntu 24.04.4 WSL2 x86_64, Micromamba 2.5.0, Python 3.11.16, Snakemake 9.27.0 y Pytest
      9.1.1; referenciar declaraciones/locks linux-64, sus 115 paquetes Conda y 48 artefactos pip, y el
      wheel instalado. Distinguir YAML declarativo de locks exactos. Sólo rutas relativas o configuración
      ignorada, sin rutas resueltas de máquina ni credenciales.
    - Preservar sin modificar 06_infra/linux-validation.json, SHA-256 bruto 254e1b195053c843e2b8c7fa39ec36f14007230c528ba1fd35d5956ed5e78c8c,
      sus nueve identidades, locks, fuentes del canary y scripts de verificación. La evidencia D020 acredita
      cinco pruebas, un fit RF, 10.55 s y 5782728 bytes de scratch final; el verificador actual comprueba
      identidad/runtime y no reejecuta esas pruebas. Citar esta distinción explícitamente en documentación
      e informe.
    - 'Describir los cinco contratos acreditados: runtime Linux y dependencias, GeoTIFF/reproyección/extracción
      con RF pequeño, DAG de dos procesos con persistencia/no-op/error, Git/ledger/lock en repositorio desechable
      y rechazo de descubrimiento vacío/ausente/skips. Reviewer inspecciona código y evidencia de la baseline
      arquitectónica, no sólo el diff documental. El wheel fue construido offline e importado fuera del
      checkout; no atribuirle una suite científica Linux completa.'
    - 'Mantener explícitos los límites: sin recreación completa de prefijo desde locks, sin suite científica
      completa Linux, sin LightGBM/XGBoost Linux, sin production/validated de M006 en Linux ni equivalencia
      numérica entre plataformas. El workflow RF fijo de M006-S01 está aceptado sólo bajo Windows D014.
      M006-S02 y M008 siguen pendientes; la presente cualificación no satisface sus puertas.'
    - 'Actualizar instrucciones de operación: bash 06_infra/linux.sh para el checkout Linux, wsl.ps1 como
      puente opcional desde Windows con configuración ignorada, sin activación global. El full de esta ronda
      es verify_preparation.py; run_checks.py de linux_smoke ejecuta el canary histórico y NO se lanza aquí.
      No presentar scripts/hermetic_verification.py ni 06_infra/run_checks.py como full Linux de esta entrega.'
    - 'D016: ningún Python nuevo o modificado por el coder. Scope arquitectónico explícito de la ronda en
      06_infra/python_header_scope_m001.json: linux_smoke/run_checks.py, test_linux.py y verify_preparation.py.
      El verificador comprueba ese scope y el scope mantenido previo; no inferir alcance de git diff HEAD
      ni editar scopes para silenciar fallos.'
    - 'Focused: python 06_infra/check_python_headers.py --scope 06_infra/python_header_scope_m001.json.
      Full una vez al terminar: python 06_infra/linux_smoke/verify_preparation.py, siempre mediante linux.sh.
      Git diff --check sobre los tres documentos debe pasar. Cero Pytest, Snakemake, canaries, fits, benchmarks,
      invocaciones de tests/run_checks.py, pip install o comandos de preparación del entorno.'
    - 'Presupuesto: 20 minutos, 5000 tokens medidos o unknown, hasta dos correcciones documentales/técnicas,
      120 segundos por comando, scratch <=16 MiB y cero ajustes/evaluaciones científicas/red/coste. Conservar
      RSS/pico scratch/tokens unknown cuando no se midan. Si cambia una identidad o falta el entorno/evidencia,
      detenerse y devolver requisito, evidencia, actor y acción; no regenerar hashes, reinstalar ni repetir
      el canary.'
    non_goals:
    - Reejecutar el canary, reconstruir entornos/wheel, adaptar producto a Linux, ampliar soporte o ejecutar
      suites científicas.
    - Cambiar código, locks, evidencias históricas, configuración local, herramientas de plantilla, servicios
      o estado Git.
    read_first:
    - 00_brief/decisions.md
    - ENVIRONMENT.md
    - 06_infra/LINUX.md
    - 08_pkg/CONTEXT.md
    - 08_pkg/README.md
    - 08_pkg/docs/workflow.md
    - 06_infra/linux-validation.json
    - 06_infra/environment-linux.yml
    - 06_infra/conda-linux-64.lock.txt
    - 06_infra/pip-linux-64.lock.txt
    - 06_infra/linux.sh
    - 06_infra/wsl.ps1
    - 06_infra/linux_smoke/run_checks.py
    - 06_infra/linux_smoke/test_linux.py
    - 06_infra/linux_smoke/verify_preparation.py
    - 06_infra/check_python_headers.py
    - 06_infra/python_header_scope.json
    - 06_infra/python_header_scope_linux.json
    - 06_infra/python_header_scope_m001.json
    - questions/answered/M001-S01-linux-environment.md
    allowed_prefixes:
    - 06_infra/LINUX.md
    - ENVIRONMENT.md
    - 08_pkg/CONTEXT.md
    focused:
    - - python
      - 06_infra/check_python_headers.py
      - --scope
      - 06_infra/python_header_scope_m001.json
    verification:
    - python
    - 06_infra/linux_smoke/verify_preparation.py
    kind: docs
    notes: D021 asigna propietario único Linux; la copia Windows queda de consulta. D020 acredita el canary
      anterior. Baseline arquitectónica incluye preparación Linux y verificador sin fits, todos con hashes
      al emitir --allow-dirty. No repetir canary ni cambiar HEAD/índice durante la ronda. M001 mantiene
      revisión holística tras aceptar esta entrega.
- id: M002
  title: Paquete, simulaciones y datos alineados
  status: done
  risk: ordinary
  holistic_review: true
  slices:
  - id: M002-S01
    title: Paquete instalable mínimo y pruebas en Windows
    objective: Crear el esqueleto instalable Wall2Wall y su verificación offline en el entorno Windows
      D014, sin algoritmos científicos.
    acceptance:
    - 'D015: operar en Windows nativo con el prefijo Conda 3.11 y Git Bash D014. Ejecutar los comandos
      Python mediante 06_infra/windows.ps1 -PythonArgs; no usar el alias python de WindowsApps ni
      cambiar el entorno.'
    - Crear 08_pkg/pyproject.toml, 08_pkg/src/wall2wall/__init__.py, 08_pkg/README.md y 08_pkg/tests/run_checks.py.
      Layout src, setuptools/build existentes, nombre local wall2wall y versión inicial 0.1.0.dev0;
      Requires-Python >=3.11. No instalar la raíz de plantilla como producto.
    - Importar wall2wall no importa Snakemake ni LightGBM/XGBoost; no crear módulos vacíos, APIs
      ficticias ni dependencias nuevas. Núcleo autorizado numpy/pandas/rasterio/scikit-learn/joblib;
      herramientas de desarrollo/workflow separadas. Extras y sus rangos se concretan al implementar
      motores, sin instalar ahora.
    - Pytest construye wheel sin red ni aislamiento de build, desde copia acotada de fuentes en VERIFICATION_SCRATCH.
      Instalar con pip --no-deps --no-index --target en scratch y verificar en otro proceso/cwd fuera
      del checkout el origen del import, nombre, versión y Requires-Python del wheel. Sin modificar
      el prefijo fijo, usar venv ni resolver paquetes.
    - 08_pkg/tests/run_checks.py usa el intérprete actual y scratch externo, descubre IDs requeridos
      y falla con cero pruebas, IDs faltantes, pruebas omitidas o dependencias core ausentes. Pytest/JUnit
      y builds fuera del producto. No invocar el full desde las pruebas ni modificar la infraestructura
      del arquitecto.
    - 'Focused: python 08_pkg/tests/run_checks.py. Full: python scripts/hermetic_verification.py;
      exige además las nueve pruebas de infraestructura preparadas. Ambos deben pasar desde windows.ps1,
      sin cambios en archivos del producto por ejecución.'
    - Documentar instalación local desde wheel, comandos exactos de prueba Windows y límites del
      esqueleto en 08_pkg/README.md; el primer ejercicio no anuncia mapas ni API científica funcional.
    - 'R2/R3: ronda manual <=60 min, <=20000 tokens si medibles (unknown si no), máximo dos correcciones;
      full <=1200 s, 1 ajuste concurrente/n_jobs=1, scratch <=512 MiB. Cero instalaciones de dependencias,
      red de pruebas, GPU, servicios de pago, datos reales o evaluaciones científicas. Sin commit/push
      del coder.'
    non_goals:
    - Algoritmos, simulador, CLI científica, workflow de producción, interfaces o módulos para etapas
      futuras.
    - Modificar scripts/, 06_infra/, roadmap, decisiones, entorno, locks o pruebas de infraestructura;
      instalar herramientas o emitir otros prompts.
    - Cualificar Linux, anunciar soporte completo Windows, publicar paquete o elegir licencia definitiva.
    read_first:
    - 00_brief/CONTEXT.md
    - 00_brief/decisions.md
    - 00_brief/architecture.md
    - 00_brief/validation.md
    - 00_brief/orchestration.md
    - 08_pkg/CONTEXT.md
    - 06_infra/WINDOWS.md
    - 06_infra/environment-windows.yml
    - 06_infra/windows.ps1
    - 06_infra/run_checks.py
    - 06_infra/windows_smoke/test_verification.py
    - scripts/hermetic_verification.py
    allowed_prefixes:
    - 08_pkg/
    focused:
    - - python
      - 08_pkg/tests/run_checks.py
    kind: code
    notes: Primer ejercicio Windows autorizado por D015. Usar implementación mínima; los archivos
      del paquete son salidas nuevas, no lecturas existentes. El arquitecto conserva la baseline
      y la evidencia; el coder implementa sólo este alcance.
  - id: M002-S05
    title: Encabezados Python y comprobación obligatoria
    objective: Aplicar D016 al esqueleto y hacer comprobable la documentación de nuevos cambios
      antes de implementar simulaciones.
    acceptance:
    - 'D016: usar el formato canónico de AGENTS.md; migrar los tres Python de M002-S01 y cada
      Python tocado por esta tarea. Revisión verifica contenido real; sin modificar comportamiento
      científico ni contrato del wheel.'
    - 'Crear 06_infra/check_python_headers.py con stdlib ast y tokenize: validar docstring inicial,
      nombre real, cuatro secciones ordenadas no vacías, separador y ausencia de marcadores de
      plantilla. Aceptar shebang/codificación y No aplica justificado; no importar ni ejecutar
      archivos inspeccionados.'
    - Crear 06_infra/python_header_scope.json con lista explícita de rutas relativas propias.
      Incluir tres Python del paquete, comprobador, 06_infra/run_checks.py y test_python_headers.py.
      Fallar ante lista vacía, archivo ausente, ruta absoluta, escape o enlace fuera del checkout;
      no recorrer entornos ni caches.
    - El arquitecto coteja el alcance con Python nuevos/modificados y baseline declarada antes
      de cada emisión y al revisar el manifiesto final. Incluir adiciones del coder antes de verificar;
      no sustituir esa cobertura con git diff HEAD. Conservar la lista de archivos ya incorporados.
    - Integrar gate y Pytest obligatorio en 06_infra/run_checks.py. Full conserva nueve pruebas
      de infraestructura y once de paquete; un fallo de encabezados impide pase. Añadir --headers-only
      como focused; no invoca el full ni omite silenciosamente pruebas requeridas.
    - Pytest cubre documento válido LF/CRLF, shebang/codificación, docstring ausente/no inicial,
      nombre erróneo, sección ausente/vacía/desordenada, plantilla sin completar, alcance inválido
      y propagación del fallo al lanzador; fixtures en scratch externo.
    - 'Windows D014/Python 3.11 mediante windows.ps1. R2/R3: 60 min, 20000 tokens o unknown, dos
      correcciones, full <=1200 s y scratch <=512 MiB. Sin dependencias nuevas, instalaciones,
      red, cambios de host ni pruebas científicas.'
    non_goals:
    - Migración masiva, API científica, nuevos motores, cambiar scripts/ o evidencia aceptada.
    read_first:
    - 00_brief/decisions.md
    - 06_infra/run_checks.py
    - 06_infra/windows_smoke/test_verification.py
    - 06_infra/windows.ps1
    - scripts/hermetic_verification.py
    - 08_pkg/src/wall2wall/__init__.py
    - 08_pkg/tests/run_checks.py
    - 08_pkg/tests/test_package.py
    - 08_pkg/README.md
    allowed_prefixes:
    - 06_infra/check_python_headers.py
    - 06_infra/python_header_scope.json
    - 06_infra/run_checks.py
    - 06_infra/windows_smoke/test_python_headers.py
    - 08_pkg/src/wall2wall/__init__.py
    - 08_pkg/tests/run_checks.py
    - 08_pkg/tests/test_package.py
    - 08_pkg/README.md
    focused:
    - - python
      - 06_infra/run_checks.py
      - --headers-only
    kind: code
    notes: Insertada tras M002-S01 conservando IDs existentes. Los archivos del comprobador, su
      alcance y sus pruebas son salidas nuevas.
  - id: M002-S02
    title: Generador y contrato de datos
    objective: Crear fixtures con verdad conocida y metadatos explícitos.
    acceptance:
    - Windows D014, Python 3.11 mediante 06_infra/windows.ps1 -PythonArgs. Implementar únicamente
      el generador de fixtures de desarrollo en 08_pkg/examples/synthetic.py y sus pruebas; no
      añadir API científica al paquete.
    - 'V2: generar por semilla 17, 29 o 43 una malla 128x128 north-up, seis predictores continuos
      p01..p06 y 256 puntos, en CRS métrico explícito. Caso base distribuido en al menos 16 bloques.
      Documentar fórmulas, magnitud del ruido y algoritmo RNG; no adaptar parámetros a resultados
      de modelos.'
    - Ofrecer variantes signal, no_signal, clustered y domain_shift. Signal usa respuesta no lineal
      conocida más ruido; no_signal genera respuesta independiente de predictores; clustered concentra
      observaciones en vecindades de sitios; domain_shift incluye región identificable fuera del
      rango predictor de los puntos de entrenamiento. Probar estas propiedades de construcción,
      sin entrenar modelos ni exigir correlaciones aleatorias exactas.
    - Crear predictors.tif, observations.csv, truth.tif y manifest.json en un directorio de salida
      nuevo fuera del checkout. CSV incluye sample_id único, x, y, response y site_id; índices
      de celda y bloques pueden ir en metadatos de prueba. Verdad y campos latentes son salidas
      separadas y nunca bandas predictoras. JSON estricto con rutas relativas, semilla, variante,
      fórmulas, nombres/orden, unidades sintéticas, soporte, período, CRS, afín, tamaño, escala/offset
      y nodata/máscara; no incluir rutas locales absolutas.
    - 'CLI mínima --output --seed --variant, invocable en proceso independiente desde cualquier
      cwd. Rechazar destino existente sin sobrescribir ni borrar contenido, semilla/variante inválida
      y salidas dentro del checkout. Dependencias ya instaladas: stdlib, numpy, pandas, rasterio;
      sin nuevas instalaciones.'
    - 'Pytest compara dos generaciones en procesos/directorios distintos con igual semilla y variante:
      mismos arrays, máscaras, geometría, CSV y metadatos estables. Definir checksum lógico de
      esos contenidos, excluyendo timestamps y diferencias de contenedor TIFF. Otra semilla cambia
      valores sin cambiar esquema. Comprobar las tres semillas y cuatro variantes, sin elegir
      sólo las que resulten favorables.'
    - Fixtures analíticas mínimas en 08_pkg/tests/test_synthetic.py cubren CRS distintos, origen/resolución,
      bandas reordenadas, bordes, escala/offset, máscaras parciales, cero válido, nodata, NaN,
      infinito, sin solapamiento e IDs repetidos. Documentar expectativas numéricas independientes;
      aquí se crean/inspeccionan las fixtures, no se implementa armonización ni muestreo de producción.
    - En 08_pkg/tests/run_checks.py añadir --synthetic-only con IDs obligatorios de las nuevas
      pruebas; el modo habitual conserva once pruebas de paquete y exige las nuevas. Full conserva
      también dieciséis pruebas de infraestructura/encabezados. Ausencia, cero pruebas o skips
      requeridos fallan. No llamar al full desde Pytest. Artefactos, caches y JUnit en scratch
      externo; actualizar documentación y encabezados del lanzador.
    - 'D016: cumplir AGENTS.md/Python file headers. Añadir synthetic.py y test_synthetic.py a
      06_infra/python_header_scope.json, conservar todas las entradas anteriores e incluir cualquier
      otro Python autorizado modificado. El arquitecto coteja baseline y manifiesto al registrar
      la entrega. No alterar el comprobador ni sus pruebas.'
    - 'R2/R3: 60 min por ronda, 20000 tokens si medibles o unknown, hasta dos correcciones, full
      <=1200 s, scratch <=512 MiB, un hilo numérico. Reportar límites no medidos. No versionar
      rasters/CSV generados, usar datos reales, ejecutar evaluaciones científicas, cambiar entorno,
      instalar dependencias ni hacer commit/push.'
    non_goals:
    - Entrenar RF/dummy, validar habilidad predictiva o consumir los lotes científicos R4; las
      pruebas del generador son deterministas.
    - API pública, armonización, extracción de producción, folds, workflow Snakemake y publicación.
    - Modificar infraestructura ejecutable, pruebas aceptadas del paquete, pyproject, locks o
      evidencia histórica.
    read_first:
    - 00_brief/architecture.md
    - 00_brief/validation.md
    - 08_pkg/CONTEXT.md
    - 08_pkg/README.md
    - 08_pkg/pyproject.toml
    - 08_pkg/tests/run_checks.py
    - 08_pkg/tests/test_package.py
    - 06_infra/windows.ps1
    - 06_infra/run_checks.py
    - 06_infra/check_python_headers.py
    - 06_infra/python_header_scope.json
    allowed_prefixes:
    - 08_pkg/examples/synthetic.py
    - 08_pkg/tests/test_synthetic.py
    - 08_pkg/tests/run_checks.py
    - 08_pkg/README.md
    - 06_infra/python_header_scope.json
    focused:
    - - python
      - 08_pkg/tests/run_checks.py
      - --synthetic-only
    kind: code
    notes: M002-S01 y M002-S05 aportan distribución y documentación comprobable. synthetic.py y test_synthetic.py
      son salidas nuevas. Las fixtures preparan M002-S03/S04; el generador es una herramienta
      de desarrollo.
  - id: M002-S03
    title: Armonización de predictores
    objective: Implementar wall2wall.spatial.align_predictors con malla explícita, valores físicos
      y validez por banda, sin cargar el cubo completo.
    acceptance:
    - Windows D014/Python 3.11 mediante windows.ps1. Crear sólo spatial.py y test_spatial.py;
      exponer align_predictors desde wall2wall.spatial, sin imports científicos nuevos al hacer
      import wall2wall. Usar stdlib, NumPy y Rasterio instalados; sin dependencias ni cambios
      de entorno.
    - 'API documentada: lista ordenada de capas con path, band base 1, name único, unidad, período
      o unknown y escala/offset opcionales; grid con CRS, afín de seis coeficientes, width y height;
      output_dir nuevo, allow_reprojection=False y window_size=512 por defecto. Devolver información
      reutilizable de capas y máscara conjunta, y escribir manifest.json portable con rutas relativas.
      No inventar una API de etapas futuras.'
    - 'Validar antes de generar salidas: entradas no vacías, nombres únicos, archivo/banda existente,
      CRS conocido, afín finito no degenerado, dimensiones enteras positivas y destino north-up.
      Derivar bounds/resolución del afín y rechazar discrepancias si también se proporcionan.
      Rechazar entradas contradictorias, capas sin solapamiento y resultado sin celdas conjuntamente
      válidas. Cobertura parcial conserva la malla objetivo y marca fuera de cobertura como inválido.'
    - Comparar CRS, dimensiones y todos los coeficientes del afín, con tolerancia declarada y
      sin confundir matrices del mismo tamaño con mallas iguales. Malla coincidente y escala/offset
      identidad reutiliza archivo/banda, sin copiar ni modificar fuente. Cambios de malla requieren
      allow_reprojection=True y método explícito por capa; soportar nearest, bilinear y average
      para continuas y registrar el elegido. Máscaras se reproyectan con nearest.
    - 'Resolver escala/offset desde metadatos o declaración: una declaración sólo reemplaza valores
      por defecto identidad; si el archivo tiene valores no triviales, debe coincidir o fallar.
      Aplicar valor_fisico=raw*scale+offset una sola vez, tras determinar validez cruda. Si la
      codificación no es identidad, materializar una capa física aunque la malla coincida; salida
      normalizada declara scale=1/offset=0 y conserva procedencia. Probar segundo paso idempotente.'
    - Validez por banda combina máscara, nodata, finitud y cobertura; cero válido se conserva.
      Excluir NaN, infinito y nodata de la interpolación, sin contaminación por sentinelas. Máscara
      conjunta equivale a AND de todas las bandas, nunca OR de máscaras del dataset; comprobar
      también finitud tras transformar/codificar. Escribir máscara conjunta uint8 con 0 inválido
      y 255 válido; conservar validez individual.
    - Procesar por ventanas y capas, con lecturas acotadas también durante reproyección; no construir
      un array de todas las capas completas ni leer fuentes completas por ventana. GeoTIFF normalizados
      con CRS/afín objetivo, nodata y máscara explícitos. Manifest JSON estricto conserva orden,
      fuentes/bandas, codificación original/efectiva, métodos, malla y referencia a productos;
      escribirlo sólo al completar. Destino existente se rechaza y fuentes conservan SHA-256;
      fallo no deja manifiesto que anuncie éxito.
    - 'Pytest usa fixtures analíticas pequeñas: identidad/reutilización, origen desplazado con
      igual shape, cambio de resolución, reproyección entre CRS, nearest/bilinear/average, escala/offset,
      nodata/NaN/infinito/cero, máscaras distintas por banda, cobertura parcial/vacía, entradas
      inválidas y destino existente. Esperados independientes: constantes y planos analíticos
      para interpolación, media manual para average; tolerancia rtol/atol <=1e-5 y geometría/máscaras
      exactas. No llamar al mismo algoritmo para obtener todos los esperados.'
    - Probar ventana que no divide dimensiones y límites entre ventanas, comparando con fixture
      analítica; instrumentar lecturas para rechazar lecturas sin ventana y limitar buffers. Usar
      un caso sintético de varias ventanas, sin evaluación de modelos. Registrar memoria medida
      o unknown y contabilidad de buffers; no afirmar medición de RAM nativa mediante tracemalloc.
    - Extender test_installed_wheel para copiar spatial.py y comprobar en proceso fuera del checkout
      que wall2wall.spatial proviene del wheel y ejecuta una alineación mínima. Conservar las
