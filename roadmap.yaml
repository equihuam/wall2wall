- id: M004
  title: Regresión, evaluación y motores opcionales
  status: planned
  risk: high
  holistic_review: true
  slices:
  - id: M004-S01
    title: Random Forest y evaluación fija
    objective: Implementar evaluación espacial OOF y ajuste final separados.
    acceptance:
    - 'D016: cumplir AGENTS.md/Python file headers en todo Python propio nuevo o modificado; comprobar estructura con el gate mantenido y veracidad en revisión. El arquitecto fija el alcance explícito antes de emitir.'
    - 'V4: clonar RF/dummy por fold, preservar estimador original, exportar OOF sin fuga y ajustar
      modelo final como operación separada.'
    - Métricas RMSE/MAE/sesgo/R² exactas sobre ejemplos manuales; por fold y agrupadas diferenciadas;
      R² indefinido null con razón.
    - 'Fixture de señal fija, semilla 17: RMSE OOF RF <= 0.9 veces dummy; protocolo congelado antes
      del resultado. Variante sin señal admite desempeño pobre correctamente reportado.'
    - Respetar presupuestos y fronteras R1–R6 del roadmap; pruebas obligatorias sin skips silenciosos.
    non_goals:
    - Tuning o inferencia causal.
    read_first:
