    - 08_pkg/tests/
    - 08_pkg/docs/
    focused: []
    kind: code
    notes: Plan inicial sin emisión. Antes de emitir, el arquitecto añade lecturas exactas del código/pruebas
      existentes y comando enfocado; las rutas de salida aún no existentes no son lecturas requeridas.
  - id: M003-S02
    title: Buffer y folds aportados
    objective: Verificar distancias y particiones externas.
    acceptance:
    - 'D016: cumplir AGENTS.md/Python file headers en todo Python propio nuevo o modificado; comprobar estructura con el gate mantenido y veracidad en revisión. El arquitecto fija el alcance explícito antes de emitir.'
    - 'V3: buffer excluye sólo entrenamiento y prueba distancia mínima >= radio; fallo claro si deja
      entrenamiento insuficiente.'
    - Folds externos validados por índices, grupos, solapamiento y cobertura; no fallback aleatorio.
      Las comparaciones aleatorias se etiquetan diagnósticas.
    - CSV de folds incluye exclusiones por buffer; documentar cómo el escenario de despliegue guía
      tamaño/distancia.
    - Respetar presupuestos y fronteras R1–R6 del roadmap; pruebas obligatorias sin skips silenciosos.
    non_goals:
