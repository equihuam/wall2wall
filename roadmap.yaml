ruled_out:
- id: R1
  text: 'Sesión inicial: sólo planificación; cero prompts (incluido preview), asientos, experimentos
    de producto, baseline aceptada, commits, publicación o servicios de pago. Antes de emitir M001-S01
    el arquitecto prepara/cualifica en scratch entorno exacto y verificador y añade lecturas de implementación
    precisas; preview sólo al reanudar. D014 admite ahora instalación Windows aislada y canary arquitectónico
    M008-S01; no admite API, prompts ni baseline. D015 autoriza ahora preparación y emisión manual
    de M002-S01 en Windows; las restricciones iniciales no impiden este prompt.'
- id: R2
  text: 'Límites de cada futura ronda manual: 60 minutos, 20000 tokens si el proveedor permite medirlos,
    máximo 2 rondas correctivas por tarea. Sin métricas de tokens registrar unknown, nunca cero ni
    cumplimiento probado. Cero llamadas facturables externas, nube o GPU. Al agotar un límite, conservar
    evidencia y volver al arquitecto; no reintentar silenciosamente. No es autorización para lanzar
    asientos en esta sesión.'
- id: R3
  text: 'Verificación de producto por invocación: 1200 segundos, 1 proceso de ajuste concurrente,
    n_jobs=1 en pruebas, caché GDAL <=128 MiB, buffers de inferencia <=128 MiB; objetivo RSS <=1
    GiB en caso sintético, registrar si no puede medirse. Scratch generado <=512 MiB por suite y
    <=1 GiB en escala; ficheros versionados de ejemplo <=1 MiB cada uno; mapas/modelos generados
    fuera de Git. Snakemake --cores 1 en pruebas y retries=0; caches/.snakemake fuera del producto.
    Réplica del gestor del perfil para instalación: hasta 6 GiB adicionales de disco y 1200 s, separada
    de datos sintéticos; fallo conserva evidencia y no reemplaza entorno fijo.'
- id: R4
  text: 'Selección sintética acotada: hasta 5 folds externos, 3 internos y 6 candidatos totales incluyendo
    familias; máximo 128 ajustes por evaluación completa (incluye refits y dummy). Semillas 17,29,43:
    hasta 3 evaluaciones científicas, una por semilla, y 1 canary técnico por nuevo límite de entorno;
    0 reemplazos automáticos. Fallo común de infraestructura detiene los intentos no iniciados; conservar
    los iniciados. Cada nuevo lote requiere protocolo del arquitecto antes de resultados. Pruebas
    deterministas del verificador no son nuevos intentos científicos; siguen sujetas a R3. Cualificación
    Windows M008: máximo dos canaries iniciales, uno por proveedor Git Bash/MSYS2, registrados antes
    de ejecutar; no reemplazos ni intentos extra silenciosos. Excepción D014: lote Git Bash con hasta
    dos correcciones técnicas explícitas, preservando fallos, sin evaluación científica.'
- id: R5
  text: 'Fuera de v0.1: adquisición/compuestos EE, clasificación/multisalida, agregación zonal, categorías
    predictoras, imputación, AutoML, early stopping, incertidumbre calibrada/AOA formal, kriging,
    GPU, Dask, servicios y GUI. No añadir dependencia fuera de D004/D010/D011/D012/D013 (workflow:
    Snakemake; dev: pytest/build/setuptools/wheel; herramientas raíz: PyYAML) sin decisión del arquitecto.
    D013: WSL recomendado; Windows sólo tras M008. Un entorno/Bash por perfil, sin mezcla de runtimes
    ni conda deployment por regla. Componentes MSYS2 opcionales sólo para el perfil Windows, con
    resolución/justificación en M008.'
- id: R6
  text: 'Piloto real sin admisión de ejecución hasta M007-S01: requiere datos/metadatos/permiso del
    propietario y protocolo previo. No existe presupuesto real implícito por completar simulaciones.
    Licencia, nombre público y publicación requieren decisión humana; sin push ni instalación global.'
